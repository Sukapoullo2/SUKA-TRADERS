<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUKA TRADERS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1118;
  color:#fff;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:#101923;
  border-bottom:1px solid #24313e;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{
  font-size:20px;
  font-weight:800;
  color:#20d38a;
}
.top-user{
  font-size:13px;
  color:#aab7c4;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.auth-screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#12382e 0,#0b1118 42%);
}

.auth-box{
  width:100%;
  max-width:430px;
  background:#111b25;
  border:1px solid #263544;
  border-radius:20px;
  padding:25px;
  box-shadow:0 20px 60px #0008;
}

.auth-logo{
  text-align:center;
  font-size:30px;
  font-weight:900;
  color:#20d38a;
  margin-bottom:8px;
}
.auth-sub{
  text-align:center;
  color:#8998a7;
  margin-bottom:25px;
}

label{
  display:block;
  color:#aebbc7;
  font-size:13px;
  margin:13px 0 7px;
}
input,textarea,select{
  width:100%;
  background:#0b131c;
  border:1px solid #2b3a49;
  color:#fff;
  border-radius:10px;
  padding:13px;
  outline:none;
}
input:focus,textarea:focus,select:focus{
  border-color:#20d38a;
}
textarea{min-height:100px;resize:vertical}

.primary{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  margin-top:18px;
  background:#20d38a;
  color:#06140e;
  font-weight:800;
}
.primary:hover{filter:brightness(1.08)}

.secondary{
  width:100%;
  border:1px solid #304050;
  border-radius:10px;
  padding:12px;
  margin-top:10px;
  background:#17232e;
  color:#fff;
}

.switch{
  text-align:center;
  margin-top:18px;
  color:#94a3b1;
  font-size:14px;
}
.switch button{
  background:none;
  border:0;
  color:#20d38a;
  font-weight:700;
}

.error{
  background:#3a171b;
  color:#ff9ea8;
  border:1px solid #703039;
  border-radius:9px;
  padding:10px;
  margin-top:13px;
  display:none;
  font-size:13px;
}

.success{
  background:#123a2b;
  color:#78e8b4;
  border:1px solid #216847;
  border-radius:9px;
  padding:10px;
  margin-top:13px;
  display:none;
  font-size:13px;
}

.app{display:none}

.layout{
  display:grid;
  grid-template-columns:210px 1fr 250px;
  gap:16px;
}

.card{
  background:#111b25;
  border:1px solid #263544;
  border-radius:14px;
  padding:16px;
  margin-bottom:15px;
}

.nav{
  position:sticky;
  top:70px;
}
.nav button{
  display:block;
  width:100%;
  text-align:left;
  background:none;
  color:#b9c5cf;
  border:0;
  padding:12px;
  border-radius:9px;
  margin-bottom:4px;
}
.nav button:hover,
.nav button.active{
  background:#17262d;
  color:#20d38a;
}

.page{display:none}
.page.active{display:block}

.page-title{
  font-size:24px;
  font-weight:800;
  margin-bottom:15px;
}

.post{
  background:#111b25;
  border:1px solid #263544;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}
.post-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#20d38a;
  color:#07130e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}
.user-info{
  display:flex;
  gap:10px;
  align-items:center;
}
.username{font-weight:800}
.muted{color:#82909e;font-size:12px}
.post-content{
  margin:14px 0;
  line-height:1.55;
  white-space:pre-wrap;
}
.tag{
  display:inline-block;
  padding:5px 8px;
  border-radius:6px;
  background:#172b38;
  color:#69dcb1;
  font-size:11px;
  margin-right:5px;
}
.actions{
  display:flex;
  gap:8px;
  border-top:1px solid #22303d;
  padding-top:10px;
}
.actions button{
  background:#17232e;
  border:1px solid #2b3a49;
  color:#bdc8d2;
  border-radius:8px;
  padding:7px 10px;
}
.actions button.liked{
  color:#20d38a;
  border-color:#20d38a;
}

.comment-box{
  display:flex;
  gap:7px;
  margin-top:10px;
}
.comment-box input{padding:9px}
.comment-box button{
  background:#20d38a;
  border:0;
  border-radius:8px;
  padding:0 13px;
}

.comment{
  padding:8px 0;
  border-bottom:1px solid #202d38;
  font-size:13px;
}

.trader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #22303d;
}
.trader-left{
  display:flex;
  align-items:center;
  gap:9px;
}

.small-btn{
  background:#20d38a;
  color:#06140e;
  border:0;
  border-radius:7px;
  padding:7px 10px;
  font-weight:700;
}
.small-btn.following{
  background:#263544;
  color:#fff;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.stat{
  background:#0d151e;
  border:1px solid #253341;
  border-radius:10px;
  padding:12px;
}
.stat strong{
  display:block;
  font-size:20px;
  color:#20d38a;
}

.journal-row{
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:750px;
}
th,td{
  padding:10px;
  border-bottom:1px solid #24313d;
  text-align:left;
  font-size:13px;
}
th{color:#20d38a}

.message-list{
  display:grid;
  grid-template-columns:190px 1fr;
  min-height:500px;
}
.message-users{
  border-right:1px solid #293744;
}
.message-user{
  padding:12px;
  border-bottom:1px solid #24313d;
  cursor:pointer;
}
.message-user:hover{
  background:#182630;
}
.chat{
  display:flex;
  flex-direction:column;
}
.chat-head{
  padding:12px;
  border-bottom:1px solid #293744;
}
.chat-body{
  flex:1;
  padding:15px;
  min-height:350px;
  overflow:auto;
}
.bubble{
  max-width:75%;
  padding:9px 12px;
  border-radius:12px;
  background:#172530;
  margin-bottom:8px;
}
.bubble.mine{
  margin-left:auto;
  background:#145238;
}
.chat-send{
  display:flex;
  gap:7px;
  padding:10px;
  border-top:1px solid #293744;
}
.chat-send input{margin:0}

.empty{
  color:#758493;
  text-align:center;
  padding:30px 10px;
}

@media(max-width:850px){
  .layout{
    grid-template-columns:1fr;
  }
  .nav{
    position:static;
    display:flex;
    overflow-x:auto;
    gap:5px;
    margin-bottom:12px;
  }
  .nav button{
    min-width:max-content;
    width:auto;
  }
  .rightbar{display:none}
}

@media(max-width:600px){
  .container{padding:10px}
  .topbar{padding:10px}
  .auth-box{padding:20px}
  .page-title{font-size:21px}
  .message-list{
    grid-template-columns:1fr;
  }
  .message-users{
    border-right:0;
    border-bottom:1px solid #293744;
    display:flex;
    overflow-x:auto;
  }
  .message-user{
    min-width:130px;
  }
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<section id="authScreen" class="auth-screen">
  <div class="auth-box">

    <div class="auth-logo">SUKA TRADERS</div>
    <div class="auth-sub">Trading Community • Journal • Markets</div>

    <h2 id="authTitle">Create Account</h2>

    <div id="signupFields">
      <label>Full Name</label>
      <input id="fullName" type="text" placeholder="Your full name">

      <label>Username</label>
      <input id="username" type="text" placeholder="username">
    </div>

    <label>Email</label>
    <input id="email" type="email" placeholder="you@example.com">

    <label>Password</label>
    <input id="password" type="password" placeholder="Minimum 6 characters">

    <button id="authButton" class="primary">Create Account</button>

    <div id="authError" class="error"></div>
    <div id="authSuccess" class="success"></div>

    <div class="switch">
      <span id="switchText">Already have an account?</span>
      <button id="switchButton">Login
