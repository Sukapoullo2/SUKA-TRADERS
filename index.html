<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SUKA TRADERS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:#f5f7fb;
      color:#172033;
    }

    button,input,select,textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .hidden{
      display:none !important;
    }

    /* AUTH */

    .auth-page{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .auth-box{
      width:100%;
      max-width:420px;
      background:white;
      padding:28px;
      border-radius:18px;
      box-shadow:0 8px 30px rgba(0,0,0,.08);
    }

    .logo{
      text-align:center;
      font-size:28px;
      font-weight:800;
      margin-bottom:8px;
    }

    .subtitle{
      text-align:center;
      color:#667085;
      margin-bottom:25px;
    }

    .tabs{
      display:flex;
      margin-bottom:20px;
      border-bottom:1px solid #ddd;
    }

    .tab{
      flex:1;
      border:0;
      background:none;
      padding:12px;
      font-weight:700;
      color:#777;
    }

    .tab.active{
      color:#111;
      border-bottom:2px solid #111;
    }

    .field{
      margin-bottom:15px;
    }

    label{
      display:block;
      font-size:14px;
      font-weight:700;
      margin-bottom:7px;
    }

    input,select,textarea{
      width:100%;
      padding:13px;
      border:1px solid #d9dee8;
      border-radius:10px;
      outline:none;
      background:white;
    }

    input:focus,select:focus,textarea:focus{
      border-color:#111;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    .primary{
      width:100%;
      padding:14px;
      border:0;
      border-radius:10px;
      background:#111827;
      color:white;
      font-weight:700;
    }

    .message{
      margin-top:15px;
      padding:12px;
      border-radius:10px;
      font-size:14px;
      display:none;
    }

    .message.show{
      display:block;
    }

    .message.error{
      background:#fee2e2;
      color:#991b1b;
    }

    .message.success{
      background:#dcfce7;
      color:#166534;
    }

    /* APP */

    .app{
      min-height:100vh;
    }

    header{
      background:#111827;
      color:white;
      padding:16px 20px;
      position:sticky;
      top:0;
      z-index:10;
    }

    .header-inner{
      max-width:1000px;
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
    }

    .brand{
      font-size:20px;
      font-weight:800;
    }

    .logout{
      background:#fff;
      color:#111827;
      border:0;
      padding:9px 14px;
      border-radius:8px;
      font-weight:700;
    }

    main{
      max-width:1000px;
      margin:auto;
      padding:20px;
    }

    .welcome{
      margin-bottom:20px;
    }

    .welcome h1{
      font-size:25px;
      margin-bottom:5px;
    }

    .welcome p{
      color:#667085;
    }

    .nav{
      display:flex;
      gap:8px;
      overflow-x:auto;
      margin-bottom:20px;
    }

    .nav button{
      white-space:nowrap;
      padding:10px 14px;
      border:1px solid #ddd;
      border-radius:9px;
      background:white;
      font-weight:700;
    }

    .nav button.active{
      background:#111827;
      color:white;
      border-color:#111827;
    }

    .section{
      background:white;
      border-radius:16px;
      padding:20px;
      box-shadow:0 3px 15px rgba(0,0,0,.05);
      margin-bottom:20px;
    }

    .section h2{
      margin-bottom:16px;
      font-size:20px;
    }

    /* STATS */

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-bottom:20px;
    }

    .stat{
      background:white;
      padding:18px;
      border-radius:14px;
      box-shadow:0 3px 15px rgba(0,0,0,.05);
    }

    .stat small{
      color:#667085;
    }

    .stat strong{
      display:block;
      font-size:25px;
      margin-top:7px;
    }

    /* FORM GRID */

    .form-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:15px;
    }

    .full{
      grid-column:1 / -1;
    }

    /* TRADES */

    .trade{
      border:1px solid #e5e7eb;
      border-radius:12px;
      padding:15px;
      margin-bottom:12px;
    }

    .trade-top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }

    .trade-title{
      font-weight:800;
    }

    .badge{
      padding:5px 9px;
      border-radius:20px;
      font-size:12px;
      font-weight:700;
    }

    .buy{
      background:#dcfce7;
      color:#166534;
    }

    .sell{
      background:#fee2e2;
      color:#991b1b;
    }

    .trade-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      font-size:14px;
    }

    .trade-grid div{
      background:#f8fafc;
      padding:9px;
      border-radius:8px;
    }

    .empty{
      text-align:center;
      padding:30px;
      color:#667085;
    }

    @media(max-width:700px){
      .stats{
        grid-template-columns:repeat(2,1fr);
      }

      .form-grid{
        grid-template-columns:1fr;
      }

      .full{
        grid-column:auto;
      }

      .trade-grid{
        grid-template-columns:repeat(2,1fr);
      }
    }
  </style>
</head>

<body>

<!-- ================= AUTH ================= -->

<div id="authPage" class="auth-page">

  <div class="auth-box">

    <div class="logo">SUKA TRADERS</div>

    <div class="subtitle">
      Simple Trading Journal
    </div>

    <div class="tabs">
      <button id="loginTab" class="tab active">
        Login
      </button>

      <button id="signupTab" class="tab">
        Create Account
      </button>
    </div>


    <!-- LOGIN -->

    <form id="loginForm">

      <div class="field">
        <label>Email</label>
        <input
          id="loginEmail"
          type="email"
          placeholder="your@email.com"
          required
        >
      </div>

      <div class="field">
        <label>Password</label>
        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          required
        >
      </div>

      <button class="primary" type="submit">
        Login
      </button>

      <div id="loginMessage" class="message"></div>

    </form>


    <!-- SIGNUP -->

    <form id="signupForm" class="hidden">

      <div class="field">
        <label>Full Name</label>
        <input
          id="signupName"
          type="text"
          placeholder="Your name"
          required
        >
      </div>

      <div class="field">
        <label>Email</label>
        <input
          id="signupEmail"
          type="email"
          placeholder="your@email.com"
          required
        >
      </div>

      <div class="field">
        <label>Password</label>
        <input
          id="signupPassword"
          type="password"
          placeholder="Minimum 6 characters"
          minlength="6"
          required
        >
      </div>

      <button class="primary" type="submit">
        Create Account
      </button>

      <div id="signupMessage" class="message"></div>

    </form>

  </div>

</div>


<!-- ================= APP ================= -->

<div id="appPage" class="app hidden">

  <header>

    <div class="header-inner">

      <div class="brand">
        SUKA TRADERS
      </div>

      <button id="logoutButton" class="logout">
        Logout
      </button>

    </div>

  </header>


  <main>

    <div class="welcome">

      <h1>
        Welcome, <span id="userName">Trader</span>
      </h1>

      <p>
        Your simple trading journal.
      </p>

    </div>


    <!-- NAVIGATION -->

    <div class="nav">

      <button
        id="dashboardNav"
        class="active"
      >
        Dashboard
      </button>

      <button id="journalNav">
        Trading Journal
      </button>

      <button id="profileNav">
        Profile
      </button>

    </div>


    <!-- ================= DASHBOARD ================= -->

    <section id="dashboardSection">

      <div class="stats">

        <div class="stat">
          <small>Total Trades</small>
          <strong id="totalTrades">0</strong>
        </div>

        <div class="stat">
          <small>Wins</small>
          <strong id="wins">0</strong>
        </div>

        <div class="stat">
          <small>Losses</small>
          <strong id="losses">0</strong>
        </div>

        <div class="stat">
          <small>Win Rate</small>
          <strong id="winRate">0%</strong>
        </div>

      </div>


      <div class="section">

        <h2>Recent Trades</h2>

        <div id="recentTrades">
          <div class="empty">
            No trades yet.
          </div>
        </div>

      </div>

    </section>


    <!-- ================= JOURNAL ================= -->

    <section id="journalSection" class="hidden">

      <div class="section">

        <h2>Add New Trade</h2>

        <form id="tradeForm">

          <div class="form-grid">

            <div class="field">
              <label>Date</label>
              <input
                id="tradeDate"
                type="date"
                required
              >
            </div>

            <div class="field">
              <label>Instrument</label>
              <input
                id="instrument"
                type="text"
                placeholder="XAUUSD / NAS100 / EURUSD"
                required
              >
            </div>

            <div class="field">
              <label>Session</label>

              <select id="session">

                <option value="London">
                  London
                </option>

                <option value="New-York">
                  New-York
                </option>

                <option value="Asia">
                  Asia
                </option>

                <option value="Other">
                  Other
                </option>

              </select>

            </div>

            <div class="field">
              <label>Direction</label>

              <select id="direction">

                <option value="Buy">
                  Buy
                </option>

                <option value="Sell">
                  Sell
                </option>

              </select>

            </div>

            <div class="field">
              <label>Setup</label>

              <input
                id="setup"
                type="text"
                placeholder="CRT / MSS / FVG"
              >
            </div>

            <div class="field">
              <label>Entry</label>

              <input
                id="entry"
                type="number"
                step="any"
                placeholder="Entry price"
              >
            </div>

            <div class="field">
              <label>Stop Loss</label>

              <input
                id="stopLoss"
                type="number"
                step="any"
                placeholder="Stop Loss"
              >
            </div>

            <div class="field">
              <label>Take Profit</label>

              <input
                id="takeProfit"
                type="number"
                step="any"
                placeholder="Take Profit"
              >
            </div>

            <div class="field">
              <label>Risk %</label>

              <input
                id="riskPercent"
                type="number"
                step="any"
                placeholder="1"
              >
            </div>

            <div class="field">
              <label>R:R</label>

              <input
                id="rr"
                type="number"
                step="any"
                placeholder="2"
              >
            </div>

            <div class="field">
              <label>Result R</label>

              <input
                id="resultR"
                type="number"
                step="any"
                placeholder="+2 / -1"
              >
            </div>

            <div class="field">
              <label>Emotion</label>

              <select id="emotion">

                <option value="">
                  Select
                </option>

                <option value="Calm">
                  Calm
                </option>

                <option value="Confident">
                  Confident
                </option>

                <option value="Fear">
                  Fear
                </option>

                <option value="Greed">
                  Greed
                </option>

                <option value="Revenge">
                  Revenge
                </option>

              </select>

            </div>

            <div class="field full">

              <label>Notes</label>

              <textarea
                id="notes"
                placeholder="Trade notes..."
              ></textarea>

            </div>

          </div>

          <button
            class="primary"
            type="submit"
          >
            Save Trade
          </button>

          <div
            id="tradeMessage"
            class="message"
          ></div>

        </form>

      </div>


      <div class="section">

        <h2>All Trades</h2>

        <div id="allTrades">
          <div class="empty">
            No trades yet.
          </div>
        </div>

      </div>

    </section>


    <!-- ================= PROFILE ================= -->

    <section id="profileSection" class="hidden">

      <div class="section">

        <h2>Profile</h2>

        <div class="field">
          <label>Name</label>

          <input
            id="profileName"
            type="text"
          >
        </div>

        <div class="field">
          <label>Email</label>

          <input
            id="profileEmail"
            type="email"
            disabled
          >
        </div>

        <button
          id="saveProfile"
          class="primary"
        >
          Save Profile
        </button>

        <div
          id="profileMessage"
          class="message"
        ></div>

      </div>

    </section>

  </main>

</div>


<script>

  /* ================= SUPABASE ================= */

  const SUPABASE_URL =
    "https://ukxzfcsvczqfcaoqzcxy.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_2MaX-5oGcTlIZh1tVlZ09g_8Fn3d5wK";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let currentUser = null;
  let trades = [];


  /* ================= HELPERS ================= */

  function $(id){
    return document.getElementById(id);
  }


  function showMessage(id,text,type="success"){

    const box = $(id);

    box.textContent = text;

    box.className =
      "message show " + type;

  }


  function hideMessage(id){

    const box = $(id);

    box.textContent = "";

    box.className = "message";

  }


  /* ================= AUTH TABS ================= */

  $("loginTab").addEventListener(
    "click",
    ()=>{
      $("loginTab").classList.add("active");
      $("signupTab").classList.remove("active");

      $("loginForm").classList.remove("hidden");
      $("signupForm").classList.add("hidden");
    }
  );


  $("signupTab").addEventListener(
    "click",
    ()=>{
      $("signupTab").classList.add("active");
      $("loginTab").classList.remove("active");

      $("signupForm").classList.remove("hidden");
      $("loginForm").classList.add("hidden");
    }
  );


  /* ================= CREATE ACCOUNT ================= */

  $("signupForm").addEventListener(
    "submit",
    async(e)=>{

      e.preventDefault();

      hideMessage("signupMessage");

      const name =
        $("signupName").value.trim();

      const email =
        $("signupEmail").value.trim();

      const password =
        $("signupPassword").value;


      const {
        data,
        error
      } =
      await supabaseClient.auth.signUp({

        email:email,

        password:password,

        options:{
          data:{
            full_name:name
          }
        }

      });


      if(error){

        showMessage(
          "signupMessage",
          error.message,
          "error"
        );

        return;
      }


      if(data?.session){

        showMessage(
          "signupMessage",
          "Account created successfully."
        );

        return;
      }


      showMessage(
        "signupMessage",
        "Account created. Check your email to confirm your account."
      );

    }
  );


  /* ================= LOGIN ================= */

  $("loginForm").addEventListener(
    "submit",
    async(e)=>{

      e.preventDefault();

      hideMessage("loginMessage");

      const email =
        $("loginEmail").value.trim();

      const password =
        $("loginPassword").value;


      const {
        data,
        error
      } =
      await supabaseClient.auth.signInWithPassword({

        email:email,

        password:password

      });


      if(error){

        showMessage(
          "loginMessage",
          error.message,
          "error"
        );

        return;
      }


      currentUser =
        data.user;

      await openApp();

    }
  );


  /* ================= OPEN APP ================= */

  async function openApp(){

    $("authPage").classList.add("hidden");

    $("appPage").classList.remove("hidden");

    $("profileEmail").value =
      currentUser.email || "";

    const name =
      currentUser.user_metadata?.full_name ||
      currentUser.email?.split("@")[0] ||
      "Trader";

    $("userName").textContent = name;

    $("profileName").value = name;

    await loadTrades();

  }


  /* ================= LOAD SESSION ================= */

  async function checkSession(){

    const {
      data
    } =
    await supabaseClient.auth.getSession();


    if(data?.session?.user){

      currentUser =
        data.session.user;

      await openApp();

    }else{

      $("authPage").classList.remove("hidden");

      $("appPage").classList.add("hidden");

    }

  }


  /* ================= LOGOUT ================= */

  $("logoutButton").addEventListener(
    "click",
    async()=>{

      await supabaseClient.auth.signOut();

      currentUser = null;

      $("appPage").classList.add("hidden");

      $("authPage").classList.remove("hidden");

      $("loginForm").reset();

    }
  );


  /* ================= NAVIGATION ================= */

  function showSection(section){

    $("dashboardSection").classList.add("hidden");

    $("journalSection").classList.add("hidden");

    $("profileSection").classList.add("hidden");


    $("dashboardNav").classList.remove("active");

    $("journalNav").classList.remove("active");

    $("profileNav").classList.remove("active");


    if(section === "dashboard"){

      $("dashboardSection").classList.remove("hidden");

      $("dashboardNav").classList.add("active");

    }


    if(section === "journal"){

      $("journalSection").classList.remove("hidden");

      $("journalNav").classList.add("active");

    }


    if(section === "profile"){

      $("profileSection").classList.remove("hidden");

      $("profileNav").classList.add("active");

    }

  }


  $("dashboardNav").addEventListener(
    "click",
    ()=>{
      showSection("dashboard");
    }
  );


  $("journalNav").addEventListener(
    "click",
    ()=>{
      showSection("journal");
    }
  );


  $("profileNav").addEventListener(
    "click",
    ()=>{
      showSection("profile");
    }
  );


  /* ================= JOURNAL ================= */
