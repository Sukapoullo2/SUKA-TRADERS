<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUKA TRADERS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1118;
  color:white;
}

.auth-screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:radial-gradient(circle at top,#12382e,#0b1118 45%);
}

.auth-box{
  width:100%;
  max-width:430px;
  background:#111b25;
  border:1px solid #263544;
  border-radius:20px;
  padding:25px;
  box-shadow:0 20px 60px #0008;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:900;
  color:#20d38a;
}

.subtitle{
  text-align:center;
  color:#8998a7;
  margin:8px 0 25px;
}

h2{
  margin-bottom:15px;
}

label{
  display:block;
  color:#aebbc7;
  font-size:13px;
  margin:13px 0 7px;
}

input{
  width:100%;
  background:#0b131c;
  border:1px solid #2b3a49;
  color:white;
  border-radius:10px;
  padding:13px;
  outline:none;
}

input:focus{
  border-color:#20d38a;
}

button{
  cursor:pointer;
}

.primary{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  margin-top:18px;
  background:#20d38a;
  color:#06140e;
  font-weight:800;
}

.primary:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.switch{
  text-align:center;
  margin-top:18px;
  color:#94a3b1;
}

.switch button{
  background:none;
  border:0;
  color:#20d38a;
  font-weight:700;
}

.error,
.success{
  display:none;
  padding:10px;
  margin-top:13px;
  border-radius:9px;
  font-size:13px;
}

.error{
  background:#3a171b;
  color:#ff9ea8;
  border:1px solid #703039;
}

.success{
  background:#123a2b;
  color:#78e8b4;
  border:1px solid #216847;
}

.app{
  display:none;
  min-height:100vh;
}

.topbar{
  padding:15px 20px;
  background:#101923;
  border-bottom:1px solid #263544;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  color:#20d38a;
  font-size:20px;
  font-weight:900;
}

.user{
  color:#aab7c4;
  font-size:13px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#111b25;
  border:1px solid #263544;
  border-radius:15px;
  padding:20px;
  margin-bottom:15px;
}

.logout{
  background:#17232e;
  color:white;
  border:1px solid #304050;
  border-radius:8px;
  padding:9px 13px;
  margin-top:15px;
}
</style>
</head>

<body>

<!-- AUTH -->

<section id="authScreen" class="auth-screen">

  <div class="auth-box">

    <div class="logo">SUKA TRADERS</div>

    <div class="subtitle">
      Trading Community • Journal • Markets
    </div>

    <h2 id="authTitle">Create Account</h2>

    <div id="signupFields">

      <label>Full Name</label>
      <input
        id="fullName"
        type="text"
        placeholder="Your full name"
      >

      <label>Username</label>
      <input
        id="username"
        type="text"
        placeholder="username"
      >

    </div>

    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="you@example.com"
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Minimum 6 characters"
    >

    <button id="authButton" class="primary">
      Create Account
    </button>

    <div id="authError" class="error"></div>

    <div id="authSuccess" class="success"></div>

    <div class="switch">

      <span id="switchText">
        Already have an account?
      </span>

      <button id="switchButton">
        Login
      </button>

    </div>

  </div>

</section>


<!-- APP -->

<div id="app" class="app">

  <div class="topbar">

    <div class="brand">
      SUKA TRADERS
    </div>

    <div class="user" id="topUser">
      User
    </div>

  </div>

  <div class="container">

    <div class="card">

      <h2>Welcome to SUKA TRADERS</h2>

      <p>
        Your trading community and journal.
      </p>

      <p id="profileInfo"></p>

      <button id="logoutButton" class="logout">
        Logout
      </button>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://ukxzfcsvczqfcaoqzcxy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2MaX-5oGcTlIZh1tVlZ09g_8Fn3d5wK";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let mode = "signup";


const authScreen =
document.getElementById("authScreen");

const app =
document.getElementById("app");

const authTitle =
document.getElementById("authTitle");

const authButton =
document.getElementById("authButton");

const switchButton =
document.getElementById("switchButton");

const switchText =
document.getElementById("switchText");

const signupFields =
document.getElementById("signupFields");

const authError =
document.getElementById("authError");

const authSuccess =
document.getElementById("authSuccess");


function showError(message){

  authError.textContent = message;

  authError.style.display = "block";

  authSuccess.style.display = "none";
}


function showSuccess(message){

  authSuccess.textContent = message;

  authSuccess.style.display = "block";

  authError.style.display = "none";
}


function clearMessages(){

  authError.style.display = "none";

  authSuccess.style.display = "none";

}


function setMode(newMode){

  mode = newMode;

  clearMessages();

  if(mode === "signup"){

    authTitle.textContent =
    "Create Account";

    authButton.textContent =
    "Create Account";

    switchText.textContent =
    "Already have an account?";

    switchButton.textContent =
    "Login";

    signupFields.style.display =
    "block";

  }else{

    authTitle.textContent =
    "Login";

    authButton.textContent =
    "Login";

    switchText.textContent =
    "Don't have an account?";

    switchButton.textContent =
    "Create Account";

    signupFields.style.display =
    "none";
  }
}


switchButton.addEventListener(
  "click",
  function(){

    if(mode === "signup"){

      setMode("login");

    }else{

      setMode("signup");

    }

  }
);


authButton.addEventListener(
  "click",
  async function(){

    clearMessages();

    const email =
    document.getElementById("email")
    .value
    .trim();

    const password =
    document.getElementById("password")
    .value;


    if(!email){

      showError("Email is required.");

      return;
    }


    if(!password){

      showError("Password is required.");

      return;
    }


    if(password.length < 6){

      showError(
        "Password must be at least 6 characters."
      );

      return;
    }


    authButton.disabled = true;

    authButton.textContent =
    "Please wait...";


    try{

      if(mode === "signup"){

        const fullName =
        document.getElementById("fullName")
        .value
        .trim();

        const username =
        document.getElementById("username")
        .value
        .trim();


        if(!fullName){

          throw new Error(
            "Full Name is required."
          );
        }


        if(!username){

          throw new Error(
            "Username is required."
          );
        }


        const {data,error} =
        await db.auth.signUp({

          email:email,

          password:password

        });


        if(error){

          throw error;

        }


        if(data.user){

          const {error:profileError} =
          await db
          .from("profiles")
          .insert({

            id:data.user.id,

            full_name:fullName,

            username:username

          });


          if(profileError){

            console.error(
              "Profile error:",
              profileError
            );

          }

        }


        if(data.session){

          showSuccess(
            "Account created successfully!"
          );

          setTimeout(
            showApp,
            500
          );

        }else{

          showSuccess(
            "Account created. Check your email to confirm your account."
          );

        }


      }else{


        const {data,error} =
        await db.auth.signInWithPassword({

          email:email,

          password:password

        });


        if(error){

          throw error;

        }


        if(data.session){

          showApp();

        }

      }


    }catch(error){

      console.error(error);

      showError(
        error.message ||
        "Something went wrong."
      );

    }


    authButton.disabled = false;

    authButton.textContent =
    mode === "signup"
      ? "Create Account"
      : "Login";

  }
);


async function showApp(){

  const {data,error} =
  await db.auth.getUser();


  if(error || !data.user){

    return;

  }


  const user =
  data.user;


  authScreen.style.display =
  "none";

  app.style.display =
  "block";


  document.getElementById(
    "topUser"
  ).textContent =
  user.email;


  const {data:profile} =
  await db
  .from("profiles")
  .select("full_name,username")
  .eq("id",user.id)
  .maybeSingle();


  if(profile){

    document.getElementById(
      "profileInfo"
    ).textContent =
    "Welcome, " +
    (profile.full_name ||
     profile.username ||
     user.email);

  }

}


document.getElementById(
  "logoutButton"
).addEventListener(
  "click",
  async function(){

    await db.auth.signOut();

    location.reload();

  }
);


db.auth.onAuthStateChange(
  function(event,session){

    if(session){

      showApp();

    }

  }
);


async function checkSession(){

  const {data} =
  await db.auth.getSession();


  if(data.session){

    showApp();

  }else{

    setMode("signup");

  }

}


checkSession();

</script>

</body>
</html>
