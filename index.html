<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUKA TRADERS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #111827;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* AUTH */

    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0b1f3a, #123f67);
    }

    .auth-box {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 15px 45px rgba(0,0,0,.2);
    }

    .brand {
      text-align: center;
      font-size: 29px;
      font-weight: 800;
      color: #0b1f3a;
      margin-bottom: 7px;
    }

    .tagline {
      text-align: center;
      color: #64748b;
      margin-bottom: 22px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #e5e7eb;
      color: #334155;
      font-weight: 700;
    }

    .tab.active {
      background: #0b1f3a;
      color: white;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      background: white;
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #0b1f3a;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      padding: 14px;
      border-radius: 10px;
      background: #0b1f3a;
      color: white;
      font-weight: 800;
      margin-top: 5px;
    }

    .primary-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }

    /* APP */

    #app {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 62px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
    }

    .top-brand {
      font-size: 21px;
      font-weight: 900;
      color: #0b1f3a;
    }

    .logout-btn {
      border: 0;
      background: #fee2e2;
      color: #991b1b;
      font-weight: 700;
      padding: 9px 13px;
      border-radius: 9px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 18px 12px 90px;
    }

    .page-title {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .card {
      background: white;
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 13px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    /* CREATE POST */

    .create-title {
      font-weight: 800;
      margin-bottom: 12px;
    }

    .post-btn {
      width: 100%;
      padding: 13px;
      background: #0b1f3a;
      color: white;
      border: 0;
      border-radius: 10px;
      font-weight: 800;
    }

    /* POST */

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 11px;
    }

    .avatar {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      background: #0b1f3a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      flex-shrink: 0;
    }

    .post-author {
      font-weight: 800;
    }

    .post-time {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }

    .post-content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.55;
      margin: 8px 0 12px;
    }

    .post-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .badge {
      background: #e8eef7;
      color: #0b1f3a;
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
    }

    .post-actions {
      display: flex;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .action-btn {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 11px 5px;
      color: #475569;
      font-weight: 700;
    }

    .action-btn:hover {
      background: #f8fafc;
    }

    .action-btn.liked {
      color: #1877f2;
    }

    .comments {
      margin-top: 12px;
    }

    .comment {
      display: flex;
      gap: 8px;
      margin-bottom: 9px;
    }

    .comment-avatar {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: #64748b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .comment-body {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 8px 10px;
      flex: 1;
    }

    .comment-name {
      font-weight: 800;
      font-size: 13px;
    }

    .comment-text {
      margin-top: 3px;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .comment-form {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .comment-form input {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 20px;
      outline: none;
    }

    .comment-form button {
      border: 0;
      border-radius: 20px;
      padding: 0 15px;
      background: #0b1f3a;
      color: white;
      font-weight: 700;
    }

    /* PROFILE */

    .profile-card {
      text-align: center;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #0b1f3a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 28px;
      font-weight: 900;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 900;
    }

    .profile-username {
      color: #64748b;
      margin: 4px 0 15px;
    }

    .save-profile {
      width: 100%;
      padding: 13px;
      background: #0b1f3a;
      color: white;
      border: 0;
      border-radius: 10px;
      font-weight: 800;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      z-index: 30;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: center;
    }

    .nav-btn {
      width: 50%;
      max-width: 350px;
      border: 0;
      background: white;
      color: #64748b;
      font-weight: 800;
      font-size: 14px;
    }

    .nav-btn.active {
      color: #0b1f3a;
    }

    .empty {
      text-align: center;
      color: #64748b;
      padding: 25px 10px;
    }

    .loading {
      text-align: center;
      color: #64748b;
      padding: 20px;
    }

    @media (max-width: 480px) {
      .top-brand {
        font-size: 18px;
      }

      .container {
        padding-left: 9px;
        padding-right: 9px;
      }
    }
  </style>
</head>

<body>

  <!-- AUTH SCREEN -->
  <section id="authScreen">
    <div class="auth-box">

      <div class="brand">SUKA TRADERS</div>
      <div class="tagline">Your Trading Community</div>

      <div class="tabs">
        <button id="loginTab" class="tab active" onclick="showAuth('login')">
          Login
        </button>

        <button id="signupTab" class="tab" onclick="showAuth('signup')">
          Create Account
        </button>
      </div>

      <!-- LOGIN -->
      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <input id="loginEmail" type="email" placeholder="your@email.com" required>
        </div>

        <div class="field">
          <label>Password</label>
          <input id="loginPassword" type="password" placeholder="Password" required>
        </div>

        <button class="primary-btn" type="submit">
          Login
        </button>
      </form>

      <!-- SIGNUP -->
      <form id="signupForm" class="hidden">
        <div class="field">
          <label>Full Name</label>
          <input id="signupName" type="text" placeholder="Your full name" required>
        </div>

        <div class="field">
          <label>Username</label>
          <input id="signupUsername" type="text" placeholder="username" required>

        <div class="field">
          <label>Email</label>
          <input id="signupEmail" type="email" placeholder="your@email.com" required>
        </div>

        <div class="field">
          <label>Password</label>
          <input id="signupPassword" type="password" placeholder="Minimum 6 characters" required>
        </div>

        <button class="primary-btn" type="submit">
          Create Account
        </button>
      </form>

      <div id="authMessage" class="message"></div>
    </div>
  </section>


  <!-- APP -->
  <section id="app" class="hidden">

    <header class="topbar">
      <div class="top-brand">↔ SUKA TRADERS</div>

      <button id="logoutBtn" class="logout-btn">
        Logout
      </button>
    </header>


    <!-- HOME -->
    <main id="homePage" class="container">

      <div class="page-title">Home</div>

      <!-- CREATE POST -->
      <div class="card">
        <div class="create-title">Create Post</div>

        <form id="postForm">

          <div class="field">
            <textarea
              id="postContent"
              placeholder="What's on your mind?"
              maxlength="5000"
              required
            ></textarea>
          </div>

          <div class="field">
            <select id="postMarket">
              <option value="">Market</option>
              <option value="XAUUSD">XAUUSD</option>
              <option value="NAS100">NAS100</option>
              <option value="EURUSD">EURUSD</option>
              <option value="EURJPY">EURJPY</option>
              <option value="AUDJPY">AUDJPY</option>
              <option value="Crypto">Crypto</option>
              <option value="Forex">Forex</option>
              <option value="General">General</option>
            </select>
          </div>

          <div class="field">
            <select id="postSetup">
              <option value="">Setup</option>
              <option value="CRT">CRT</option>
              <option value="ICT">ICT</option>
              <option value="SMC">SMC</option>
              <option value="Price Action">Price Action</option>
              <option value="Breakout">Breakout</option>
              <option value="Analysis">Analysis</option>
              <option value="General">General</option>
            </select>
          </div>

          <button id="postSubmit" class="post-btn" type="submit">
            Post
          </button>

        </form>

        <div id="postMessage" class="message"></div>
      </div>


      <!-- FEED -->
      <div id="feed">
        <div class="loading">Loading posts...</div>
      </div>

    </main>


    <!-- PROFILE -->
    <main id="profilePage" class="container hidden">

      <div class="page-title">My Profile</div>

      <div class="card profile-card">

        <div id="profileAvatar" class="profile-avatar">
          U
        </div>

        <div id="profileDisplayName" class="profile-name">
          User
        </div>

        <div id="profileDisplayUsername" class="profile-username">
          @username
        </div>

      </div>

      <div class="card">

        <div class="field">
          <label>Full Name</label>
          <input id="profileFullName" type="text">
        </div>

        <div class="field">
          <label>Username</label>
          <input id="profileUsername" type="text">
        </div>

        <div class="field">
          <label>Country</label>
          <input id="profileCountry" type="text" placeholder="Niger">
        </div>

        <div class="field">
          <label>Bio</label>
          <textarea id="profileBio" maxlength="500"></textarea>
        </div>

        <button id="saveProfileBtn" class="save-profile">
          Save Profile
        </button>

        <div id="profileMessage" class="message"></div>

      </div>

    </main>


    <!-- NAV -->
    <nav class="bottom-nav">

      <button id="homeNav" class="nav-btn active" onclick="showPage('home')">
        🏠 Home
      </button>

      <button id="profileNav" class="nav-btn" onclick="showPage('profile')">
        👤 Profile
      </button>

    </nav>

  </section>


<script>
  /* =========================
     SUPABASE CONFIG
  ========================= */

  const SUPABASE_URL =
    "https://ukxzfcsvczqfcaoqzcxy.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_2MaX-5oGcTlIZh1tVlZ09g_8Fn3d5wK";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  let currentUser = null;
  let openComments = new Set();


  /* =========================
     HELPERS
  ========================= */

  function escapeHtml(value) {
    if (value === null || value === undefined) return "";

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function initials(name) {
    const text = String(name || "User").trim();

    if (!text) return "U";

    const parts = text.split(/\s+/);

    if (parts.length === 1) {
      return parts[0].substring(0, 2).toUpperCase();
    }

    return (
      parts[0][0] +
      parts[parts.length - 1][0]
    ).toUpperCase();
  }


  function timeAgo(dateString) {
    const date = new Date(dateString);

    if (Number.isNaN(date.getTime())) {
      return "";
    }

    const seconds =
      Math.floor((Date.now() - date.getTime()) / 1000);

    if (seconds < 60) return "Just now";

    const minutes = Math.floor(seconds / 60);

    if (minutes < 60) {
      return minutes + "m ago";
    }

    const hours = Math.floor(minutes / 60);

    if (hours < 24) {
      return hours + "h ago";
    }

    const days = Math.floor(hours / 24);

    if (days < 30) {
      return days + "d ago";
    }

    return date.toLocaleDateString();
  }


  function showMessage(element, text, type) {
    element.textContent = text;
    element.className = "message show " + type;
  }


  /* =========================
     AUTH UI
  ========================= */

  function showAuth(type) {

    const loginForm =
      document.getElementById("loginForm");

    const signupForm =
      document.getElementById("signupForm");

    const loginTab =
      document.getElementById("loginTab");

    const signupTab =
      document.getElementById("signupTab");

    const message =
      document.getElementById("authMessage");

    message.className = "message";
    message.textContent = "";

    if (type === "login") {

      loginForm.classList.remove("hidden");
      signupForm.classList.add("hidden");

      loginTab.classList.add("active");
      signupTab.classList.remove("active");

    } else {

      loginForm.classList.add("hidden");
      signupForm.classList.remove("hidden");

      loginTab.classList.remove("active");
      signupTab.classList.add("active");
    }
  }


  /* =========================
     AUTH
  ========================= */

  async function login(email, password) {

    const { data, error } =
      await db.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    currentUser = data.user;

    await ensureProfile();

    showApp();

    await loadFeed();
  }


  async function signup(name, username, email, password) {

    const { data, error } =
      await db.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: name,
            username: username
          }
        }
      });

    if (error) throw error;

    if (data.user) {
      currentUser = data.user;

      await ensureProfile();

      if (data.session) {
        showApp();
        await loadFeed();
      } else {
        showMessage(
          document.getElementById("authMessage"),
          "Account created. Check your email if confirmation is required.",
          "success"
        );
      }
    }
  }


  async function logout() {

    const { error } = await db.auth.signOut();

    if (error) {
      alert(error.message);
      return;
    }

    currentUser = null;

    document
      .getElementById("app")
      .classList.add("hidden");

    document
      .getElementById("authScreen")
      .classList.remove("hidden");
  }


  /* =========================
     PROFILE
  ========================= */

  async function ensureProfile() {

    if (!currentUser) return;

    const { data, error } =
      await db
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

    if (error) {
      console.error("Profile read error:", error);
      return;
    }

    if (data) return;

    const metadata =
      currentUser.user_metadata || {};

    const fullName =
      metadata.full_name ||
      currentUser.email?.split("@")[0] ||
      "User";

    let username =
      metadata.username ||
      ("user" + currentUser.id.substring(0, 8));

    username =
      username
        .toLowerCase()
        .replace(/[^a-z0-9_]/g, "")
        .substring(0, 30);

    if (username.length < 3) {
      username =
        "user" +
        currentUser.id.substring(0, 8);
    }

    const { error: insertError } =
      await db
        .from("profiles")
        .insert({
          id: currentUser.id,
          username,
          full_name: fullName,
          country: "Niger",
          language: "English"
        });

    if (insertError) {
      console.error(
        "Profile creation error:",
        insertError
      );
    }
  }


  async function loadProfile() {

    if (!currentUser) return;

    const { data, error } =
      await db
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

    if (error) {
      showMessage(
        document.getElementById("profileMessage"),
        error.message,
        "error"
      );
      return;
    }

    if (!data) return;

    document.getElementById("profileFullName").value =
      data.full_name || "";

    document.getElementById("profileUsername").value =
      data.username || "";

    document.getElementById("profileCountry").value =
      data.country || "";

    document.getElementById("profileBio").value =
      data.bio || "";

    document.getElementById("profileDisplayName").textContent =
      data.full_name || "User";

    document.getElementById("profileDisplayUsername").textContent =
      "@" + (data.username || "user");

    document.getElementById("profileAvatar").textContent =
      initials(data.full_name);
  }


  async function saveProf
