<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUKA TRADERS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f0f2f5;
  color:#111827;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.hidden{
  display:none!important;
}

/* HEADER */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:white;
  border-bottom:1px solid #ddd;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  display:block;
  font-size:11px;
  color:#65676b;
  font-weight:500;
}

/* MAIN */

.container{
  max-width:720px;
  margin:auto;
  padding:15px 12px 80px;
}

/* AUTH */

.auth{
  max-width:430px;
  margin:50px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.auth h1{
  margin:0;
}

.subtitle{
  color:#65676b;
  margin-top:5px;
}

.tabs{
  display:flex;
  gap:8px;
  margin:20px 0;
}

.tabs button{
  flex:1;
  padding:12px;
  border-radius:9px;
  background:#e4e6eb;
  font-weight:bold;
}

.tabs button.active{
  background:#111827;
  color:white;
}

.form{
  display:grid;
  gap:11px;
}

input,
textarea{
  width:100%;
  border:1px solid #ccd0d5;
  border-radius:9px;
  padding:12px;
  outline:none;
  background:white;
}

input:focus,
textarea:focus{
  border-color:#111827;
}

.primary{
  background:#111827;
  color:white;
  padding:12px;
  border-radius:9px;
  font-weight:bold;
}

.secondary{
  background:#e4e6eb;
  color:#111827;
  padding:10px 14px;
  border-radius:9px;
  font-weight:bold;
}

.message{
  display:none;
  padding:10px;
  border-radius:8px;
  font-size:14px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

/* POST CREATOR */

.card{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:14px;
  border:1px solid #ddd;
}

.create-title{
  font-weight:bold;
  margin-bottom:10px;
}

/* POSTS */

.feed{
  display:grid;
  gap:14px;
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#111827;
  color:white;
  display:grid;
  place-items:center;
  font-weight:bold;
}

.post-name{
  font-weight:bold;
}

.post-time{
  color:#65676b;
  font-size:12px;
  margin-top:2px;
}

.post-content{
  white-space:pre-wrap;
  line-height:1.5;
  margin:14px 0;
}

.post-info{
  color:#65676b;
  font-size:13px;
  margin-bottom:10px;
}

.actions{
  border-top:1px solid #ddd;
  padding-top:9px;
  display:flex;
  gap:8px;
}

.actions button{
  flex:1;
  background:#f0f2f5;
  padding:9px;
  border-radius:8px;
}

.actions button:hover{
  background:#e4e6eb;
}

.comments{
  margin-top:10px;
}

.comment{
  background:#f0f2f5;
  border-radius:10px;
  padding:9px;
  margin-top:7px;
}

.comment-name{
  font-weight:bold;
  font-size:13px;
}

.comment-text{
  font-size:14px;
  margin-top:3px;
}

/* PROFILE */

.profile-top{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.big-avatar{
  width:70px;
  height:70px;
  border-radius:50%;
  background:#111827;
  color:white;
  display:grid;
  place-items:center;
  font-size:26px;
  font-weight:bold;
}

.profile-name{
  font-size:21px;
  font-weight:bold;
}

.muted{
  color:#65676b;
  font-size:13px;
}

.empty{
  text-align:center;
  color:#65676b;
  padding:35px 10px;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:100;
  height:58px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:center;
  gap:8px;
  padding:8px;
}

.bottom button{
  background:white;
  padding:8px 20px;
  border-radius:9px;
}

.bottom button.active{
  background:#111827;
  color:white;
}

</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<div id="authScreen" class="auth">

<h1>SUKA TRADERS</h1>

<div class="subtitle">
Trading Community
</div>

<div class="tabs">

<button
id="loginTab"
class="active"
onclick="showAuth('login')">
Login
</button>

<button
id="signupTab"
onclick="showAuth('signup')">
Create Account
</button>

</div>


<!-- LOGIN -->

<form id="loginForm" class="form">

<input
id="loginEmail"
type="email"
placeholder="Email"
required
>

<input
id="loginPassword"
type="password"
placeholder="Password"
required
>

<button
id="loginButton"
class="primary"
>
Login
</button>

<div
id="loginMessage"
class="message">
</div>

</form>


<!-- SIGN UP -->

<form
id="signupForm"
class="form hidden"
>

<input
id="signupName"
type="text"
placeholder="Full name"
required
>

<input
id="signupEmail"
type="email"
placeholder="Email"
required
>

<input
id="signupPassword"
type="password"
placeholder="Password (minimum 6 characters)"
minlength="6"
required
>

<button
id="signupButton"
class="primary"
>
Create Account
</button>

<div
id="signupMessage"
class="message">
</div>

</form>

</div>


<!-- ================= APP ================= -->

<div id="app" class="hidden">


<header class="topbar">

<div class="logo">
SUKA TRADERS
<span>Trading Community</span>
</div>

<button
class="secondary"
onclick="logout()">
Logout
</button>

</header>


<main class="container">


<!-- HOME -->

<section id="homePage">


<div class="card">

<h3 id="welcomeText">
Welcome 👋
</h3>

<div class="muted">
Share your trading ideas with other traders.
</div>

</div>


<!-- CREATE POST -->

<div class="card">

<div class="create-title">
Create a Post
</div>

<form
id="postForm"
class="form"
>

<textarea
id="postContent"
rows="4"
maxlength="5000"
placeholder="What's on your mind?"
required
></textarea>

<input
id="postMarket"
placeholder="Market e.g. XAUUSD"
>

<input
id="postSetup"
placeholder="Setup e.g. CRT / ICT / SMC"
>

<button
id="postButton"
class="primary">
Post
</button>

<div
id="postMessage"
class="message">
</div>

</form>

</div>


<!-- FEED -->

<div
id="feed"
class="feed">
</div>


</section>


<!-- PROFILE -->

<section
id="profilePage"
class="hidden">

<div class="card">

<div class="profile-top">

<div
id="profileAvatar"
class="big-avatar">
S
</div>

<div>

<div
id="profileName"
class="profile-name">
Trader
</div>

<div
id="profileEmail"
class="muted">
</div>

</div>

</div>


<form
id="profileForm"
class="form">

<input
id="profileFullName"
placeholder="Full name"
>

<input
id="profileUsername"
placeholder="Username"
>

<input
id="profileCountry"
placeholder="Country"
>

<textarea
id="profileBio"
rows="4"
placeholder="Bio">
</textarea>

<button
class="primary">
Save Profile
</button>

<div
id="profileMessage"
class="message">
</div>

</form>

</div>

</section>

</main>


<!-- NAVIGATION -->

<nav class="bottom">

<button
id="homeNav"
class="active"
onclick="showPage('home')">
🏠 Home
</button>

<button
id="profileNav"
onclick="showPage('profile')">
👤 Profile
</button>

</nav>

</div>


<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://ukxzfcsvczqfcaoqzcxy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2MaX-5oGcTlIZh1tVlZ09g_8Fn3d5wK";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let currentUser = null;


/* ================= HELPERS ================= */

function $(id){
return document.getElementById(id);
}


function showMessage(id,text,type){

const el=$(id);

el.textContent=text;

el.className=
"message "+type;

el.style.display="block";

}


function hideMessage(id){

const el=$(id);

el.style.display="none";

}


function escapeHtml(value){

return String(value ?? "")
.replace(/[&<>"']/g,function(char){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[char];

});

}


/* ================= AUTH TABS ================= */

function showAuth(type){

const login =
type==="login";

$("loginForm")
.classList
.toggle("hidden",!login);

$("signupForm")
.classList
.toggle("hidden",login);

$("loginTab")
.classList
.toggle("active",login);

$("signupTab")
.classList
.toggle("active",!login);

}


/* ================= PROFILE ================= */

async function loadProfile(){

if(!currentUser)return;


const {data,error} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();


if(error){

console.error(error);

return;

}


const name =
data?.full_name ||
data?.username ||
currentUser.email.split("@")[0] ||
"Trader";


$("welcomeText").textContent =
"Welcome, "+name+" 👋";


$("profileName").textContent =
name;


$("profileEmail").textContent =
currentUser.email;


$("profileAvatar").textContent =
name.charAt(0).toUpperCase();


$("profileFullName").value =
data?.full_name || "";


$("profileUsername").value =
data?.username || "";


$("profileCountry").value =
data?.country || "";


$("profileBio").value =
data?.bio || "";

}


/* ================= FEED ================= */

async function loadFeed(){

const feed=$("feed");

feed.innerHTML=
'<div class="card empty">Loading posts...</div>';


const {data,error} =
await supabaseClient
.from("posts")
.select(`
id,
user_id,
content,
market,
setup_tag,
created_at,
profiles(
full_name,
username
)
`)
.order(
"created_at",
{ascending:false}
);


if(error){

console.error(error);

feed.innerHTML=
'<div class="card empty">Could not load posts.</div>';

return;

}


if(!data || data.length===0){

feed.innerHTML=
'<div class="card empty">No posts yet. Be the first trader to post! 🚀</div>';

return;

}


feed.innerHTML="";


for(const post of data){

const profile =
post.profiles || {};


const name =
profile.full_name ||
profile.username ||
"Trader";


const initial =
name.charAt(0).toUpperCase();


const date =
new Date(
post.created_at
).toLocaleString();


const card =
document.createElement("article");

card.className="card";


card.innerHTML=`

<div class="post-header">

<div class="avatar">
${escapeHtml(initial)}
</div>

<div>

<div class="post-name">
${escapeHtml(name)}
</div>

<div class="post-time">
${escapeHtml(date)}
</div>

</div>

</div>


<div class="post-content">
${escapeHtml(post.content)}
</div>


${
post.market || post.setup_tag
?
`
<div class="post-info">

${
post.market
?
"📊 "+escapeHtml(post.market)
:""
}

${
post.setup_tag
?
" • "+escapeHtml(post.setup_tag)
:""
}

</div>
`
:""
}


<div class="actions">

<button
onclick="likePost('${post.id}')">
👍 Like
</button>

<button
onclick="toggleComments('${post.id}')">
💬 Comment
</button>

</div>


<div
id="comments-${post.id}"
class="comments">
</div>

`;


feed.appendChild(card);

}

}


/* ================= LIKE ================= */

async function likePost(postId){

if(!currentUser)return;


const {error} =
await supabaseClient
.from("likes")
.upsert(
{
post_id:postId,
user_id:currentUser.id
},
{
onConflict:
"post_id,user_id"
}
);


if(error){

alert(error.message);

return;

}

}


/* ================= COMMENTS ================= */

async function toggleComments(postId){

const box =
$("comments-"+postId);


if(box.innerHTML){

box.innerHTML="";

return;

}


box.innerHTML=`

<div class="comment">

<input
id="commentInput-${postId}"
placeholder="Write a comment..."
>

<br><br>

<button
class="secondary"
onclick="addComment('${postId}')">
Send
</button>

</div>

`;


const {data,error} =
await supabaseClient
.from("comments")
.select(`
id,
content,
created_at,
profiles(
full_name,
username
)
`)
.eq("post_id",postId)
.order(
"created_at",
{ascending:true}
);


if(error){

console.error(error);

return;

}


if(data){

data.forEach(comment=>{

const profile =
comment.profiles || {};

const name =
profile.full_name ||
profile.username ||
"Trader";


const div =
document.createElement("div");

div.className="comment";

div.innerHTML=`

<div class="comment-name">
${escapeHtml(name)}
</div>

<div class="comment-text">
${escapeHtml(comment.content)}
</div>

`;

box.appendChild(div);

});

}

}


/* ================= ADD COMMENT ================= */

async function addComment(postId){

const input =
$("commentInput-"+postId);


const content =
input?.value.trim();


if(!content)return;


const {error} =
await supabaseClient
.from("comments")
.insert({

post_id:postId,

user_id:currentUser.id,

content:content

});


if(error){

alert(error.message);

return;

}


await toggleComments(postId);

}


/* ================= LOGIN ================= */

$("loginForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

hideMessage("loginMessage");


const email =
$("loginEmail")
.value
.trim();


const password =
$("loginPassword")
.value;


$("loginButton").disabled=true;

$("loginButton").textContent=
"Logging in...";


const {data,error} =
await supabaseClient
.auth
.signInWithPassword({

email:email,

password:password

});


$("loginButton").disabled=false;

$("loginButton").textContent=
"Login";


if(error){

showMessage(
"loginMessage",
error.message,
"error"
);

return;

}


currentUser=data.user;

await openApp();

});


/* ================= SIGN UP ================= */

$("signupForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

hideMessage("signupMessage");


const name =
$("signupName")
.value
.trim();


const email =
$("signupEmail")
.value
.trim();


const password =
$("signupPassword")
.value;


if(password.length<6){

showMessage(
"signupMessage",
"Password must be at least 6 characters.",
"error"
);

return;

}


$("signupButton").disabled=true;

$("signupButton").textContent=
"Creating account...";


const {data,error} =
await supabaseClient
.auth
.signUp({

email:email,

password:password,

options:{
data:{
full_name:name
}
}

});


$("signupButton").disabled=false;

$("signupButton").textContent=
"Create Account";


if(error){

showMessage(
"signupMessage",
error.message,
"error"
);

return;

}


if(data.session){

currentUser=data.user;

await openApp();

return;

}


showMessage(
"signupMessage",
"Account created. Check your email to confirm your account.",
"success"
);

});


/* ================= CREATE POST ================= */

$("postForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

hideMessage("postMessage");


const content =
$("postContent")
.value
.trim();


const market =
$("postMarket")
.value
.trim();


const setup =
$("postSetup")
.value
.trim();


if(!content){

showMessage(
"postMessage",
"Write something before posting.",
"error"
);

return;

}


$("postButton").disabled=true;

$("postButton").textContent=
"Posting...";


const {error} =
await supabaseClient
.from("posts")
.insert({

user_id:currentUser.id,

content:content,

market:market || null,

setup_tag:setup || null

});


$("postButton").disabled=false;

$("postButton").textContent=
"Post";


if(error){

showMessage(
"postMessage",
error.message,
"error"
);

return;

}


$("postContent").value="";

$("postMarket").value="";

$("postSetup").value="";


showMessage(
"postMessage",
"Post published successfully.",
"success"
);


await loadFeed();

});


/* ================= PROFILE SAVE ================= */

$("profileForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

hideMessage("profileMessage");


const full_name =
$("profileFullName")
.value
.trim();


const username =
$("profileUsername")
.value
.trim() || null;


const country =
$("profileCountry")
.value
.trim() || null;


const bio =
$("profileBio")
.value
.trim() || null;


const {error} =
await supabaseClient
.from("profiles")
.upsert({

id:currentUser.id,

full_name:full_name,

username:username,

country:country,

bio:bio,

updated_at:
new Date().toISOString()

});


if(error){

showMessage(
"profileMessage",
error.message,
"error"
);

return;

}


showMessage(
"profileMessage",
"Profile saved successfully.",
"success"
);


await loadProfile();

});


/* ================= PAGE ================= */

function showPage(page){

const home =
page==="home";


$("homePage")
.classList
.toggle("hidden",!home);


$("profilePage")
.classList
.toggle("hidden",home);


$("homeNav")
.classList
.toggle("active",home);


$("profileNav")
.classList
.toggle("active",!home);


if(home){

loadFeed();

}

}


/* ================= OPEN APP ================= */

async function openApp(){

$("authScreen")
.classList
.add("hidden");


$("app")
.classList
.remove("hidden");


await loadProfile();

await loadFeed();

showPage("home");

}


/* ================= LOGOUT ================= */

async function logout(){

await supabaseClient
.auth
.signOut();


currentUser=null;


$("app")
.classList
.add("hidden");


$("authScreen")
.classList
.remove("hidden");


showAuth("login");

}


/* ================= INIT ================= */

async function init(){

const {data} =
await supabaseClient
.auth
.getSession();


if(data.session){

currentUser=
data.session.user;

await openApp();

}

}


supabaseClient
.auth
.onAuthStateChange(
function(event,session){

if(event==="SIGNED_OUT"){

currentUser=null;

}

});


init();

</script>

</body>
  </html>
